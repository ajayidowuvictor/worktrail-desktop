name: Build Rockmines WorkTrail

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Staff PCs update when this number grows. Change 1.1 to 1.2 for a bigger release.
  APP_BASE: '1.1'

permissions:
  contents: write

jobs:
  # 1. Self-check: opens the program on a test machine and takes pictures.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Tools for running a window on a test machine
        run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libasound2t64 || sudo apt-get install -y xvfb libgbm1 libasound2
      - name: Start test page
        run: |
          python3 -m http.server 8765 --directory smoke-site &
          sleep 2
      - name: Run the program self-check
        env:
          WORKTRAIL_SMOKE: '1'
          WORKTRAIL_URL: http://127.0.0.1:8765/worktrail/
          SMOKE_OUT: ${{ github.workspace }}/smoke-out
        shell: bash
        run: |
          mkdir -p smoke-out
          xvfb-run -a npx electron . --no-sandbox --disable-gpu 2>&1 | tee smoke-out/log.txt
      - name: Report self-check results
        if: always()
        run: |
          msg=$(grep -E "PASS|FAIL|SMOKE|Error|error" smoke-out/log.txt | head -80 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=self-check::${msg}"
          fails=$(grep -c "^FAIL" smoke-out/log.txt || true)
          echo "::notice title=self-check-fail-count::${fails}"
      - name: Save the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-check-pictures
          path: smoke-out
          if-no-files-found: ignore

  # 2. The Windows installer.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build the installer
        shell: bash
        run: npx electron-builder --win --x64 --publish never -c.extraMetadata.version=${APP_BASE}.${{ github.run_number }}
      - name: Make sure the update file exists
        shell: bash
        run: |
          node scripts/make-latest.js
          ls -la dist
          cat dist/latest.yml
          # A copy with a name that never changes, so one download link always gives the newest installer.
          cp "dist/Rockmines-WorkTrail-Setup-${APP_BASE}.${{ github.run_number }}.exe" dist/Rockmines-WorkTrail-Setup.exe
      - name: Save the Windows files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  # 3. The Android app.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy the welcome animation into the Android app
        run: python3 scripts/sync-android-assets.py
      - name: Signing key (a secret called WT_KEYSTORE_B64, kept by GitHub)
        env:
          WT_KEYSTORE_B64: ${{ secrets.WT_KEYSTORE_B64 }}
        run: |
          if [ -n "$WT_KEYSTORE_B64" ]; then
            echo "$WT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wt.p12"
            echo "WT_KEYSTORE_FILE=$RUNNER_TEMP/wt.p12" >> "$GITHUB_ENV"
            echo "WT_KEYSTORE_PASSWORD=worktrail-signing" >> "$GITHUB_ENV"
            echo "WT_KEY_ALIAS=worktrail" >> "$GITHUB_ENV"
            echo "WT_KEY_PASSWORD=worktrail-signing" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning title=android-signing::No signing key yet (secret WT_KEYSTORE_B64). The phone app is built for testing only and is not published."
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi
      - name: Build the phone app
        shell: bash
        run: gradle -p android assembleDebug assembleRelease --stacktrace -PwtVersionName=${APP_BASE}.${{ github.run_number }} -PwtVersionCode=${{ github.run_number }} 2>&1 | tee gradle.log
      - name: Show build problems
        if: always()
        shell: bash
        run: |
          [ -f gradle.log ] || exit 0
          grep -q "BUILD FAILED" gradle.log || exit 0
          msg=$(grep -E "error:|error |FAILED|What went wrong|Execution failed|Could not|Caused by|symbol|location:|^> " gradle.log | head -40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=android-build::${msg}"
      - name: Collect the files
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-out/debug-for-test.apk
          if [ "$SIGNED" = "yes" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk-out/Rockmines-WorkTrail.apk
            cp android/app/build/outputs/apk/release/app-release.apk "apk-out/Rockmines-WorkTrail-${APP_BASE}.${{ github.run_number }}.apk"
          fi
          ls -la apk-out
          if [ "$SIGNED" = "yes" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs apk-out/Rockmines-WorkTrail.apk | head -4 | while IFS= read -r l; do echo "::notice title=apk-signature::$l"; done
          fi
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging apk-out/debug-for-test.apk | grep -E "^package|sdkVersion|application-label:" | while IFS= read -r l; do echo "::notice title=apk-info::$l"; done || true
      - name: Save the phone app files
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk-out/*

  # 4. Self-check of the phone app on a virtual phone.
  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk-out
      - name: Allow the virtual phone to use hardware speed-up
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the self-check on a virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: bash android/ci/run-smoke.sh
      - name: Report self-check results
        if: always()
        run: |
          if [ -f smoke-android.log ]; then
            msg=$(head -70 smoke-android.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=phone-self-check::${msg}"
          else
            echo "::warning title=phone-self-check::no log file"
          fi

  # 5. One release with the Windows installer and the phone app.
  publish:
    needs: [windows, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk-files
      - name: Pick the files to publish
        run: |
          rm -f apk-files/debug-for-test.apk
          ls -la release-files apk-files
      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_BASE }}.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            release-files/*
            apk-files/*
          name: Rockmines WorkTrail ${{ env.APP_BASE }}.${{ github.run_number }}
          body: |
            **Windows PC:** download **Rockmines-WorkTrail-Setup.exe**, double-click it, and WorkTrail installs itself.
            If Windows shows a blue "Windows protected your PC" box, click **More info**, then **Run anyway**.

            **Android phone:** download **Rockmines-WorkTrail.apk** on the phone and open it. Allow "install from this source" when asked.
